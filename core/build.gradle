plugins { id 'java-library' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Pure rules: no Minecraft, NeoForge or library on any classpath.
tasks.register('verifyBoundary') {
    inputs.files(configurations.compileClasspath, configurations.runtimeClasspath)
    doLast { task ->
        if (!task.inputs.files.files.empty)
            throw new GradleException('core must stay dependency-free Java. Change this boundary only in an explicit task.')
    }
}
tasks.named('check') { dependsOn 'verifyBoundary' }
