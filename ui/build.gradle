plugins {
    id 'java-library'
    id 'com.diffplug.spotless'
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Formatting is part of the gate: `check` fails on unformatted code. Fix with ./gradlew spotlessApply
spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat('2.102.0')
        removeUnusedImports()
        formatAnnotations()
    }
}
tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xlint:all', '-Werror'] }

// Screen geometry and palette: plain Java, testable without a game.
tasks.register('verifyBoundary') {
    inputs.files(configurations.compileClasspath, configurations.runtimeClasspath)
    doLast { task ->
        if (!task.inputs.files.files.empty)
            throw new GradleException('ui must stay dependency-free Java. Change this boundary only in an explicit task.')
    }
}
tasks.named('check') { dependsOn 'verifyBoundary' }
