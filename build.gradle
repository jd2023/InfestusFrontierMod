plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'com.diffplug.spotless'
}

evaluationDependsOn(':core')
evaluationDependsOn(':ui')
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.theillusivec4.top' }
    maven {
        url = 'https://dl.cloudsmith.io/public/klikli-dev/mods/maven/'
        content { includeGroup 'com.klikli_dev' }
    }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven' }
}

sourceSets {
    // ModDevGradle keys development mod folders by source-set name. The ui
    // module's own "main" would collide, so its sources are mirrored here.
    devUi {
        java.setSrcDirs([project(':ui').file('src/main/java')])
        resources.setSrcDirs([project(':ui').file('src/main/resources')])
    }
    testMod
}
configurations {
    testModImplementation.extendsFrom implementation
    testModRuntimeOnly.extendsFrom runtimeOnly
}

def captureScenarioDir = layout.projectDirectory.dir('src/testMod/resources/captures')
def captureScenarios = fileTree(captureScenarioDir) { include '*.json' }.files.collect { it.name - '.json' }.sort()
// -PcaptureOnly=a,b photographs and verifies only those scenarios; scripts/verify.sh runs all.
def captureOnly = providers.gradleProperty('captureOnly').map { it.split(',') as List }.getOrElse(captureScenarios)
def captureOutput = layout.buildDirectory.dir('captures')

// Optional runtime mods for manual play: ./gradlew runClient -PwithJei -PwithCurios
def withJei = providers.gradleProperty('withJei').isPresent()
def withCurios = providers.gradleProperty('withCurios').isPresent()

dependencies {
    implementation project(':core')
    implementation project(':ui')
    compileOnly "com.klikli_dev:modonomicon-1.21.1-neoforge:${modonomicon_version}"
    runtimeOnly "com.klikli_dev:modonomicon-1.21.1-neoforge:${modonomicon_version}"
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}:api") { transitive = false }
    if (withJei) runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    if (withCurios) runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    testModImplementation sourceSets.main.output
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.3'
    testModCompileOnly "com.klikli_dev:modonomicon-1.21.1-neoforge:${modonomicon_version}"
}

neoForge {
    version = project.neo_version
    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }
    addModdingDependenciesTo sourceSets.testMod
    mods {
        infestusfrontier {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
            sourceSet sourceSets.devUi
        }
        infestusfrontier_tests { sourceSet sourceSets.testMod }
    }
    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
            loadedMods = [mods.infestusfrontier]
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('runs/server')
            loadedMods = [mods.infestusfrontier]
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.testMod
            gameDirectory = project.file('runs/gametest')
            loadedMods = [mods.infestusfrontier, mods.infestusfrontier_tests]
            systemProperty 'neoforge.enabledGameTestNamespaces', 'infestusfrontier_tests'
            systemProperty 'neoforge.gameTestServer.forceExit', 'false'
            jvmArgument '-Xmx2G' // the gate's processes have fixed heaps; a leak fails here, not on the machine
        }
        // Disposable client that photographs every scenario in src/testMod/resources/captures.
        capture {
            client()
            sourceSet = sourceSets.testMod
            gameDirectory = project.file('runs/capture')
            loadedMods = [mods.infestusfrontier, mods.infestusfrontier_tests]
            systemProperty 'infestusfrontier.capture.dir', captureOutput.get().asFile.absolutePath
            systemProperty 'infestusfrontier.capture.scenarios', captureOnly.join(',')
            jvmArgument '-Xmx3G'
        }
        // Playable client in a fresh world built from the capture scenario src/testMod/resources/captures/demo.json.
        demo {
            client()
            sourceSet = sourceSets.testMod
            gameDirectory = project.file('runs/demo')
            loadedMods = [mods.infestusfrontier, mods.infestusfrontier_tests]
            systemProperty 'infestusfrontier.demo.scene', 'demo'
            jvmArgument '-Xmx3G'
        }
    }
}

def metadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.property 'mod_version', project.version
    expand mod_version: project.version
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
}
sourceSets.main.resources.srcDir metadata
neoForge.ideSyncTask metadata

tasks.named('jar', Jar) {
    from project(':core').sourceSets.main.output
    from project(':ui').sourceSets.main.output
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Formatting is part of the gate: `check` fails on unformatted code. Fix with ./gradlew spotlessApply
spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat('2.102.0')
        removeUnusedImports()
        formatAnnotations()
    }
    format 'text', {
        target '*.md', 'docs/**/*.md', '*.gradle', '*/build.gradle', 'scripts/*.sh', '.editorconfig', '.gitignore'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// The shipped JAR holds the mod, core and ui, and nothing from the test mod.
abstract class VerifyDistribution extends DefaultTask {
    @InputFile abstract RegularFileProperty getArtifact()
    @TaskAction void verify() {
        new java.util.zip.ZipFile(artifact.get().asFile).withCloseable { jar ->
            for (String required : ['META-INF/neoforge.mods.toml',
                    'org/jd/infestusfrontier/InfestusFrontier.class',
                    'org/jd/infestusfrontier/core/foundation/TickQuota.class',
                    'org/jd/infestusfrontier/ui/Bounds.class']) {
                if (jar.getEntry(required) == null) throw new GradleException("Missing runtime entry: $required")
            }
            jar.entries().each { entry ->
                if (entry.name.contains('/testmod/') || entry.name.contains('infestusfrontier_tests'))
                    throw new GradleException("Development-only content shipped: ${entry.name}")
            }
            String metadata = jar.getInputStream(jar.getEntry('META-INF/neoforge.mods.toml')).getText('UTF-8')
            if (metadata.contains('${')) throw new GradleException('Unexpanded mod metadata')
        }
    }
}
def distribution = tasks.register('verifyDistribution', VerifyDistribution) {
    dependsOn tasks.named('jar')
    artifact = tasks.named('jar', Jar).flatMap { it.archiveFile }
}

def gameTestProperties = layout.projectDirectory.file('runs/gametest/server.properties')
def prepareGameTest = tasks.register('prepareGameTest', Copy) {
    from 'src/testMod/server.properties'
    into layout.projectDirectory.dir('runs/gametest')
    onlyIf { !gameTestProperties.asFile.exists() }
}
// A hung game process fails the gate instead of holding it: no run outlives its timeout.
// A server that never ran its tests, as one whose mods failed to load, exits cleanly too: the log must say they passed.
def gameTestLog = layout.projectDirectory.file('runs/gametest/logs/latest.log')
tasks.named('runGameTestServer') {
    dependsOn prepareGameTest
    mustRunAfter ':core:test', ':ui:test', distribution
    timeout = java.time.Duration.ofMinutes(15)
    doFirst { gameTestLog.asFile.delete() }
    doLast {
        def log = gameTestLog.asFile
        if (!log.exists() || !(log.text =~ /All \d+ required tests passed/))
            throw new GradleException("The GameTest server did not report its tests passed; see ${log}")
    }
}

// Feature screens declare parts; only the kit in foundation/screen draws.
tasks.register('verifyScreenKit') {
    def screens = fileTree('src/main/java') { include '**/*Screen.java'; exclude '**/foundation/screen/**' }
    inputs.files(screens)
    doLast {
        def drawing = ['GuiGraphics', 'blit(', 'drawString(', 'renderBg', 'renderLabels', 'ResourceLocation']
        def offenders = screens.files.findAll { file -> def text = file.text; drawing.any { text.contains(it) } }
        if (!offenders.empty)
            throw new GradleException("Screens compose parts from foundation/screen and never draw: ${offenders*.name}")
    }
}
tasks.named('test') { useJUnitPlatform() }
tasks.named('check') { dependsOn 'verifyScreenKit' }

tasks.register('verifyVisualAssets', Exec) {
    group = 'verification'
    description = 'Checks organ motion, model surfaces and biomass texture continuity (Python 3 with Pillow).'
    commandLine 'python3', '-m', 'unittest', 'discover', '-s', 'art', '-p', 'test_*.py'
}
tasks.named('check') { dependsOn 'verifyVisualAssets' }

tasks.register('verifyAll') {
    group = 'verification'
    description = 'The gate: pure tests, boundaries, shipped JAR contents, GameTests in a real server.'
    dependsOn ':core:check', ':ui:check', tasks.named('build'), distribution, tasks.named('runGameTestServer')
}

// Every capture must exist, show no missing texture, not be a flat frame, and match its golden when one exists.
abstract class VerifyCaptures extends DefaultTask {
    @InputDirectory abstract DirectoryProperty getScenarios()
    @Input abstract ListProperty<String> getSelected()
    @InputDirectory @org.gradle.api.tasks.Optional abstract DirectoryProperty getGoldens()
    @InputDirectory abstract DirectoryProperty getCaptures()
    /**
     * A view with "icons": [ids...] names what the hotbar holds, left to right. Each icon's visual centroid must sit
     * within 1.5 px of its slot centre and nothing may be drawn outside the 16 px square. World views are shot at GUI
     * scale 2, so the hotbar is 182x22 scaled by 2 at the bottom centre; grey hotbar pixels and the dark ground seen
     * through it are background.
     */
    static List<String> iconProblems(String label, java.awt.image.BufferedImage img, List<String> icons) {
        List<String> problems = []
        int S = 2
        int left = img.width.intdiv(2) - 91 * S, top = img.height - 22 * S
        // CaptureClient parks the selection on slot 8; its ring starts one pixel left of that slot and is not an icon.
        int ringLeft = left + (20 * 8 - 1) * S
        icons.eachWithIndex { String icon, int i ->
            int x0 = left + (3 + 20 * i) * S, y0 = top + 3 * S
            long sx = 0, sy = 0, count = 0
            int minX = 99, maxX = -1, minY = 99, maxY = -1
            for (int y = -2 * S; y < 18 * S; y++) for (int x = -2 * S; x < 18 * S; x++) {
                if (x0 + x >= ringLeft) continue
                int rgb = img.getRGB(x0 + x, y0 + y)
                int r = (rgb >> 16) & 0xff, g = (rgb >> 8) & 0xff, b = rgb & 0xff
                boolean ground = g >= r && g >= b && g < 90 && r < 80
                boolean grey = Math.abs(r - g) < 10 && Math.abs(g - b) < 10
                if (ground || grey) continue
                sx += x; sy += y; count++
                minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y)
            }
            if (count == 0) { problems << "${label}: ${icon} draws nothing in slot ${i}"; return }
            double cx = sx / (double) count / S - 7.75, cy = sy / (double) count / S - 7.75 // pixel centres sit at index + 0.5
            if (Math.abs(cx) > 1.5 || Math.abs(cy) > 1.5)
                problems << "${label}: ${icon} centroid off by (${String.format('%.1f', cx)}, ${String.format('%.1f', cy)}) px"
            if (minX < 0 || minY < 0 || maxX >= 16 * S || maxY >= 16 * S)
                problems << "${label}: ${icon} draws outside its slot (x ${minX / S}..${(maxX + 1) / S}, y ${minY / S}..${(maxY + 1) / S})"
        }
        return problems
    }

    @TaskAction void verify() {
        File root = captures.get().asFile
        File reportFile = new File(root, 'report.json')
        if (!reportFile.file) throw new GradleException("The capture client wrote no report at ${reportFile}")
        def report = new groovy.json.JsonSlurper().parse(reportFile)
        if (report.failure) throw new GradleException("Capture client failed: ${report.failure}")
        List<String> problems = []
        int checked = 0
        def available = scenarios.get().asFile.listFiles().findAll { it.name.endsWith('.json') }.collect { it.name - '.json' }
        if (selected.get().empty || !available.containsAll(selected.get()))
            throw new GradleException("Unknown or empty capture selection: ${selected.get()}")
        scenarios.get().asFile.listFiles({ File f -> f.name.endsWith('.json') && selected.get().contains(f.name - '.json') } as FileFilter).sort().each { File scenarioFile ->
            String scenario = scenarioFile.name - '.json'
            def spec = new groovy.json.JsonSlurper().parse(scenarioFile)
            spec.views.collectMany { view ->
                (0..<(view.frames ?: 1)).collect { frame ->
                    def shot = new LinkedHashMap(view)
                    shot.name = view.name + (frame == 0 ? '' : String.format('_%03d', frame))
                    shot
                }
            }.each { view ->
                File image = new File(root, "${scenario}/${view.name}.png")
                String label = "${scenario}/${view.name}.png"
                if (!image.file) { problems << "${label}: missing"; return }
                java.awt.image.BufferedImage img = javax.imageio.ImageIO.read(image)
                if (img == null) { problems << "${label}: not a readable PNG"; return }
                int w = img.width, h = img.height, n = w * h
                double[] stats = imageStats(img)
                long magenta = (long) stats[0]
                double stddev = stats[1]
                if (magenta * 1000 > n * 2) problems << "${label}: ${magenta} missing-texture pixels"
                if (stddev < 4) problems << "${label}: flat frame (luminance stddev ${String.format('%.2f', stddev)})"
                File golden = goldens.present ? new File(goldens.get().asFile, "${scenario}/${view.name}.png") : null
                if (golden != null && golden.file) {
                    java.awt.image.BufferedImage ref = javax.imageio.ImageIO.read(golden)
                    if (ref.width != w || ref.height != h) problems << "${label}: size ${w}x${h} differs from golden ${ref.width}x${ref.height}"
                    else {
                        long differing = 0
                        for (int y = 0; y < h; y++) for (int x = 0; x < w; x++) {
                            int a = img.getRGB(x, y), c = ref.getRGB(x, y)
                            if (Math.abs(((a >> 16) & 0xff) - ((c >> 16) & 0xff)) > 32
                                    || Math.abs(((a >> 8) & 0xff) - ((c >> 8) & 0xff)) > 32
                                    || Math.abs((a & 0xff) - (c & 0xff)) > 32) differing++
                        }
                        if (differing * 1000 > n * 5) problems << "${label}: ${differing} pixels differ from the golden"
                    }
                }
                if (view.icons) problems.addAll(iconProblems(label, img, view.icons as List<String>))
                checked++
            }
        }
        if (problems) throw new GradleException("Capture checks failed:\n  " + problems.join('\n  '))
        logger.lifecycle("Captures verified: ${checked} images under ${root}")
    }

    // Timed sequences inspect every pixel of every frame; compile this hot loop without Groovy boxing.
    @groovy.transform.CompileStatic
    private static double[] imageStats(java.awt.image.BufferedImage img) {
        int w = img.width, h = img.height, n = w * h
        long magenta = 0
        double sum = 0, sumSq = 0
        for (int y = 0; y < h; y++) for (int x = 0; x < w; x++) {
            int rgb = img.getRGB(x, y)
            int r = (rgb >> 16) & 0xff, g = (rgb >> 8) & 0xff, b = rgb & 0xff
            if (r > 200 && g < 60 && b > 200) magenta++
            double lum = 0.299 * r + 0.587 * g + 0.114 * b
            sum += lum; sumSq += lum * lum
        }
        double mean = sum / n
        return [magenta, Math.sqrt(Math.max(0d, sumSq / n - mean * mean))] as double[]
    }
}

// Fresh world and output each run; fixed client options and FML config so the client never shows a first-run screen.
def prepareCapture = tasks.register('prepareCapture') {
    def world = layout.projectDirectory.dir('runs/capture/saves/capture').asFile
    def output = captureOutput.get().asFile
    def runDir = layout.projectDirectory.dir('runs/capture').asFile
    def options = layout.projectDirectory.file('src/testMod/capture/options.txt').asFile
    def fml = layout.projectDirectory.file('src/testMod/capture/fml.toml').asFile
    inputs.files(options, fml)
    outputs.upToDateWhen { false }
    doLast {
        [world, output].each { it.deleteDir() }
        new File(runDir, 'config').mkdirs()
        new File(runDir, 'options.txt').text = options.text
        new File(runDir, 'config/fml.toml').text = fml.text
    }
}
tasks.named('runCapture') {
    dependsOn prepareCapture
    mustRunAfter tasks.named('runGameTestServer')
    outputs.upToDateWhen { false }
    timeout = java.time.Duration.ofMinutes(20)
}
// Fresh demo world each run. The client options are seeded once and then left to the owner.
def prepareDemo = tasks.register('prepareDemo') {
    def world = layout.projectDirectory.dir('runs/demo/saves/demo').asFile
    def runDir = layout.projectDirectory.dir('runs/demo').asFile
    def options = layout.projectDirectory.file('src/testMod/capture/options.txt').asFile
    def fml = layout.projectDirectory.file('src/testMod/capture/fml.toml').asFile
    inputs.files(options, fml)
    outputs.upToDateWhen { false }
    doLast {
        world.deleteDir()
        new File(runDir, 'config').mkdirs()
        def seeded = new File(runDir, 'options.txt')
        if (!seeded.exists()) seeded.text = options.text
        new File(runDir, 'config/fml.toml').text = fml.text
    }
}
tasks.named('runDemo') {
    dependsOn prepareDemo
    outputs.upToDateWhen { false }
}
tasks.register('verifyCaptures', VerifyCaptures) {
    group = 'verification'
    description = 'Runs the capture client and checks every screenshot.'
    dependsOn tasks.named('runCapture')
    scenarios = captureScenarioDir
    selected = captureOnly
    captures = captureOutput
    def goldenDir = captureScenarioDir.dir('golden')
    if (goldenDir.asFile.directory) goldens = goldenDir
}
